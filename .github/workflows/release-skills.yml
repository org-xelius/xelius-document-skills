name: Release skills

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m pip install pypdf==6.10.0
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils libreoffice inkscape
      - run: npx playwright install --with-deps chromium
      - run: npm run test:install
      - run: npm run test:artifacts
        env:
          XELIUS_ARTIFACTS_DIR: ${{ runner.temp }}/xelius-artifact-evidence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-fixture-evidence
          path: ${{ runner.temp }}/xelius-artifact-evidence
      - run: npm run release
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tgz
            dist/release-manifest.json
