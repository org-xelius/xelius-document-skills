<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img" aria-labelledby="title desc">
  <title id="title">Monthly enrolment, January–April 2026</title>
  <desc id="desc">Registrations: January 10, February not recorded, March 18, April 16. February is missing, not zero. January is an isolated point; only March and April are connected. Vertical scale starts at zero and ends at 20. Source: Synthetic curriculum and enrolment register, 2026; not real participant data. Counts are registrations, not completions.</desc>
  <rect width="680" height="330" fill="#fff"/>
  <g font-family="Arial,Helvetica,sans-serif" fill="#182b3b">
    <text x="18" y="23" font-size="19" font-weight="700">Monthly enrolment, Jan–Apr 2026</text>
    <text x="18" y="47" font-size="14" fill="#425466">Registrations</text>
    <g stroke="#d8e0e6" stroke-width="1">
      <line x1="65" x2="630" y1="58" y2="58"/>
      <line x1="65" x2="630" y1="103" y2="103"/>
      <line x1="65" x2="630" y1="148" y2="148"/>
      <line x1="65" x2="630" y1="193" y2="193"/>
    </g>
    <line x1="65" x2="630" y1="238" y2="238" stroke="#607687" stroke-width="1.2"/>
    <g font-size="14" text-anchor="end" fill="#425466">
      <text x="52" y="63">20</text><text x="52" y="108">15</text><text x="52" y="153">10</text><text x="52" y="198">5</text><text x="52" y="243">0</text>
    </g>
    <g stroke="#607687" stroke-width="1">
      <line x1="78" x2="78" y1="238" y2="244"/><line x1="250" x2="250" y1="238" y2="244"/>
      <line x1="422" x2="422" y1="238" y2="244"/><line x1="594" x2="594" y1="238" y2="244"/>
    </g>
    <g font-size="15" text-anchor="middle">
      <text x="78" y="265">Jan</text><text x="250" y="265">Feb*</text><text x="422" y="265">Mar</text><text x="594" y="265">Apr</text>
    </g>
    <text x="250" y="286" text-anchor="middle" font-size="14" fill="#425466">* Not recorded</text>
    <path id="recorded-segment" d="M 422 76 L 594 94" fill="none" stroke="#165d7b" stroke-width="3" stroke-linecap="round"/>
    <g fill="#165d7b" stroke="#fff" stroke-width="2">
      <circle data-month="2026-01" data-value="10" cx="78" cy="148" r="6"/>
      <circle data-month="2026-03" data-value="18" cx="422" cy="76" r="6"/>
      <circle data-month="2026-04" data-value="16" cx="594" cy="94" r="6"/>
    </g>
    <g fill="#fff">
      <rect x="64" y="114" width="28" height="24"/>
      <rect x="408" y="43" width="28" height="24"/>
      <rect x="580" y="61" width="28" height="24"/>
    </g>
    <g font-size="17" font-weight="700" text-anchor="middle">
      <text data-label="2026-01" x="78" y="132">10</text>
      <text data-label="2026-03" x="422" y="60">18</text>
      <text data-label="2026-04" x="594" y="78">16</text>
    </g>
    <text x="18" y="316" font-size="13" fill="#425466">No line bridges the missing February value. Months are equally spaced.</text>
  </g>
</svg>
