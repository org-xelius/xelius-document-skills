<rect x="202" y="86" width="96" height="167" fill="#F5F5F5"/>
<text x="250" y="157" text-anchor="middle" class="gap-label"><tspan x="250">Not</tspan><tspan x="250" dy="20">recorded</tspan></text>
<path d="M 428 109 L 606 125" class="series" data-segment="2026-03:2026-04"/>
