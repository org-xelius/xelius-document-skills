<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" aria-labelledby="chart-title chart-desc">
<title id="chart-title">Monthly enrolment, January–April 2026</title>
<desc id="chart-desc">Recorded registrations: January 10, February not recorded, March 18, April 16. No line crosses the missing February value. A line connects only March and April. Counts are registrations, not completions. Source: Synthetic curriculum and enrolment register, 2026; not real participant data.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#111111}.heading{font-size:20px;font-weight:700}.unit,.month,.tick,.gap-label{font-size:15px}.value{font-size:17px;font-weight:700;fill:#0B3C5D}.source{font-size:12px;fill:#555555}.grid{stroke:#D6D6D6;stroke-width:1}.baseline{stroke:#555555;stroke-width:1.2}.series{fill:none;stroke:#0B3C5D;stroke-width:3;stroke-linecap:round}.point{fill:#0B3C5D;stroke:#FFFFFF;stroke-width:2}.gap-label{fill:#555555}</style>
<rect width="680" height="350" fill="#FFFFFF"/>
<text x="0" y="23" class="heading">Monthly enrolment, January–April 2026</text>
<text x="0" y="51" class="unit">Registrations (people)</text>
